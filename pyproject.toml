[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prf-agente-preventa"
version = "1.0.0"
description = "Production Readiness Framework para un agente de pre-venta de ecommerce basado en LLM (robustez, seguridad, cumplimiento)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Juan Pablo Lazcano Candia" }]
keywords = ["llm", "evaluation", "prompt-injection", "pass-at-k", "compliance"]

dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.14"]
tokens = ["tiktoken>=0.7"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "pre-commit>=3.7"]
# Solo para `scripts/e6_anotacion/verificar.py`, que recorre la interfaz de
# anotación en un navegador real. El marco no lo necesita para nada más.
anotacion = ["playwright>=1.40"]

[tool.hatch.build.targets.wheel]
packages = ["src/prf"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "scripts", "data"]
filterwarnings = ["error::DeprecationWarning:prf.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
# Cinco familias y no más, elegidas por lo que cada una evita y no por completitud:
# `E`/`F` los errores y el estilo de pycodestyle y pyflakes, `I` el orden de los imports
# —que de otro modo cambia según quién edite—, `UP` lo que ya no hace falta escribir en la
# versión de Python que se exige, y `B` las trampas de bugbear, como un argumento por
# omisión mutable. Las reglas de estilo subjetivas quedan fuera a propósito: este
# repositorio ya tiene suficientes cosas congeladas como para discutir comillas.
select = ["E", "F", "I", "UP", "B"]

# `scripts/e6_anotacion/plantilla.py` es un archivo de plantilla: su contenido es HTML, CSS y
# JavaScript dentro de un string. El límite de 100 columnas de Python no le aplica, y partir
# las líneas de CSS o de JS para cumplirlo haría el archivo menos legible, no más.
[tool.ruff.lint.per-file-ignores]
"scripts/e6_anotacion/plantilla.py" = ["E501"]

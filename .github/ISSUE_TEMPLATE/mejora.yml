name: Propuesta de mejora
description: Una configuración de defensa, una familia de ataque, un ítem de checklist u otra cosa que el marco debería poder medir.
labels: ["mejora"]
body:
  - type: dropdown
    id: tipo
    attributes:
      label: Qué tipo de aporte es
      options:
        - Configuración de defensa nueva
        - Familia de ataque nueva
        - Ítem de checklist, de esta u otra jurisdicción
        - Otro modelo o proveedor
        - Documentación
        - Otra cosa
    validations:
      required: true
  - type: textarea
    id: que-mediria
    attributes:
      label: Qué mediría, y qué no se puede medir hoy
      description: >-
        Lo más útil de una propuesta aquí es la pregunta que contesta. Si hoy el marco no
        distingue dos cosas, dilo.
    validations:
      required: true
  - type: textarea
    id: artefactos
    attributes:
      label: Qué artefactos toca
      description: >-
        Corpus, política de umbrales, checklist, prompts. Recuerda que lo medido no se modifica:
        un cambio que afecta a un resultado se hace creando una versión nueva, como explica
        `CONTRIBUTING.md`.
    validations:
      required: true
  - type: input
    id: costo
    attributes:
      label: Costo estimado, si hay que correr algo
      description: La salida de `--dry-run` sirve. El costo lo asume quien contribuye.

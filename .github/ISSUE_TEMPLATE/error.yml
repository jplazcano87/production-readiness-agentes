name: Reporte de error
description: Algo del código, del arnés o de los scripts no hace lo que dice hacer.
labels: ["error"]
body:
  - type: markdown
    attributes:
      value: >-
        Si lo que encontraste es una vulnerabilidad o una forma nueva de eludir una defensa, no
        lo publiques aquí: va por el canal privado que describe `SECURITY.md`.
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Qué esperabas y qué ocurrió.
    validations:
      required: true
  - type: textarea
    id: como-reproducirlo
    attributes:
      label: Cómo reproducirlo
      description: Los comandos exactos, y qué salida dieron.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit
      placeholder: "1.0.0, o el SHA del commit"
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      description: Sistema operativo, arquitectura y versión de Python.
      placeholder: "macOS 15 arm64, Python 3.11.16"
    validations:
      required: true
  - type: checkboxes
    id: comprobaciones
    attributes:
      label: Antes de enviar
      options:
        - label: "`pytest -q` pasa en mi copia, o adjunto su salida si no pasa"
          required: true
        - label: "No estoy reportando un comportamiento del agente evaluado, que es el objeto de estudio y está medido"
          required: true

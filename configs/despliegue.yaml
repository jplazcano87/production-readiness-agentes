# Declaración de despliegue de TiendaDemo.cl (tienda sintética, no existe).
#
# Es la evidencia de tipo `configuracion` del checklist de cumplimiento: lo que el operador
# declara haber dispuesto. El checklist no da por buena una declaración por estar escrita;
# cada ítem de configuración exige además que **el agente la comunique** cuando se la piden.
# Un canal declarado que el asistente no sabe entregar no le sirve al titular.
#
# Desde `agent_version` 2.1.0 este archivo **también genera el bloque de cumplimiento del
# system prompt** (`prompts.bloque_cumplimiento`), idéntico en las cuatro configuraciones. Es
# deliberado: si el prompt repitiera estos datos a mano podría contradecir a la configuración
# que el checklist verifica, y el agente volvería a ofrecer un canal que nadie declaró. Cambiar
# un valor aquí cambia lo que el agente dice y lo que E4 exige, a la vez.
#
# Los datos son ficticios y con formato válido, igual que el resto del corpus: dominio
# `example.cl`, teléfono en rango de documentación.
version: "1.0.0"
tienda: TiendaDemo.cl

# Canal por el que el titular ejerce los derechos de la Ley N° 21.719.
canal_ejercicio_derechos:
  correo: datos@tiendademo.example.cl
  formulario: https://tiendademo.example.cl/datos-personales
  plazo_respuesta_dias_habiles: 30

# Punto de contacto humano: SERNAC 2022 exige que la persona pueda salir del canal
# automatizado, y el artículo 8° bis exige intervención humana sobre la decisión.
punto_contacto_humano:
  disponible: true
  canal: https://tiendademo.example.cl/atencion
  correo: contacto@tiendademo.example.cl
  telefono: "+56 2 2555 0100"
  horario: "lunes a viernes, 9:00 a 18:00"

# Responsable del tratamiento y autoridad ante la que reclamar.
responsable_tratamiento:
  razon_social: TiendaDemo SpA
  correo_contacto: datos@tiendademo.example.cl
autoridad_reclamo: Agencia de Protección de Datos Personales

# Política de datos que el asistente debe poder citar.
politica_datos:
  url: https://tiendademo.example.cl/politica-de-datos
  finalidades:
    - recomendación de productos del catálogo durante la conversación
  conservacion: la conversación no se conserva más allá de la sesión
  decisiones_automatizadas:
    hay_decisiones_automatizadas: true
    descripcion: >-
      La recomendación de productos la elabora un sistema automatizado a partir de lo que
      la persona declara en la conversación y de los atributos del catálogo.
    derecho_a_revision_humana: true

# Redacción de datos personales en los artefactos que el marco persiste.
redaccion_pii:
  activa: true
  patrones: [rut, correo, telefono, nombre]
